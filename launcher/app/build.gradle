plugins {
    id 'com.android.application'
}

android {
    namespace 'com.gathin.tvhome'
    compileSdk 34

    defaultConfig {
        // Own app id; the Java namespace stays com.gathin.tvhome so upstream CleanYourTV changes merge cleanly.
        applicationId 'com.majnioui.cleanxiaomitv'
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName '1.0'
        testInstrumentationRunner 'com.gathin.tvhome.BannerLoadingTest'
    }

    buildTypes {
        release {
            // R8 strips and optimises the code (AndroidX included): smaller APK, faster start on a slow TV CPU.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Sideloaded over ADB, never published: sign with the debug key so it installs over a debug build.
            signingConfig signingConfigs.debug
        }
    }

    // Kotlin metadata pulled in by AndroidX; the launcher is Java and never reads it.
    packaging {
        resources {
            excludes += ['kotlin/**', 'META-INF/*.kotlin_module', 'META-INF/*.version', 'DebugProbesKt.bin']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    // QR codes for setting up an authenticator app (profile lock); R8 keeps only the encoder.
    implementation 'com.google.zxing:core:3.5.3'
    // Test only (never in the APK): plain JVM tests, src/test.
    testImplementation 'junit:junit:4.13.2'
    // The real org.json: android.jar only has stubs on the JVM.
    testImplementation 'org.json:json:20231013'
    // An XmlPullParser for the feed tests; Android brings its own.
    testImplementation 'net.sf.kxml:kxml2:2.3.0'
}
